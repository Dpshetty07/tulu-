  --acc:#d9ad68;--onacc:#20190e;--leaf:#fffdf6;--leafink:#2b352d;--leafedge:#e4ddca;
  --kbd:#18261f;--key:#34483c;--keyfn:#435b4b;--keysh:#0b1410;--keytxt:#f4f3e9;--hole:#101915;
  --kh:3.45rem;           /* key height */
  --tf:"Mandara";         /* chosen Tulu font */
  color-scheme:dark
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f1f2ec;--fg:#26342b;--muted:#68786d;--panel:#fffefa;--line:#d8dfd6;
    --acc:#a97025;--onacc:#fffaf0;--leaf:#fffdf7;--leafink:#2b352d;--leafedge:#e4ddca;
    --kbd:#e2e8e0;--key:#fffefa;--keyfn:#d2ddd2;--keysh:#bdcbbd;--keytxt:#26342b;--hole:#f1f2ec;
    color-scheme:light
  }
}

/* ============ Base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  -webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100%;
  background:radial-gradient(ellipse at 50% -18%,rgba(217,173,104,.11),transparent 54%),var(--bg);
  background-color:var(--bg)
}
body{
  margin:0 auto;width:min(100%,48rem);
  min-height:100vh;min-height:100dvh;
  padding:calc(1.5rem + env(safe-area-inset-top,0px)) calc(1rem + env(safe-area-inset-right,0px)) calc(2rem + env(safe-area-inset-bottom,0px)) calc(1rem + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:.85rem;
  background:transparent;color:var(--fg);
  font-family:system-ui,"Segoe UI","Noto Sans Kannada",sans-serif;
  overflow-wrap:break-word
}
body>*{min-width:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
button{font-family:inherit;touch-action:manipulation}

/* ============ Header + size picker ============ */
header{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.2rem .15rem 1rem;border-bottom:1px solid var(--line)}
h1{margin:0;min-width:0;font:650 1.55rem/1.15 Georgia,"Iowan Old Style","Palatino Linotype",serif;letter-spacing:-.025em}
h1::before{content:"TULU LIPI  ·  MANDARA";display:block;margin-bottom:.32rem;color:var(--muted);font:700 .66rem/1.2 system-ui,sans-serif;letter-spacing:.16em}
.sz{display:flex;align-items:center;gap:.55rem;flex-shrink:0;color:var(--muted);font-size:.75rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.cb{position:relative;display:flex}
.cb input{width:3.6rem;min-height:2.65rem;font:650 1rem system-ui,sans-serif;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-right:0;border-radius:11px 0 0 11px;padding:.4rem .5rem;text-align:center}
.cb button{min-height:2.65rem;min-width:2.4rem;font-size:.7rem;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:0 11px 11px 0;padding:0 .65rem;cursor:pointer}
.bd{min-height:2.65rem;min-width:2.65rem;padding:0;font:800 1.15rem Georgia,serif;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:11px;cursor:pointer}
.bd[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.cb ul{position:absolute;top:100%;right:0;z-index:20;margin:4px 0 0;padding:.25rem 0;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:min(14rem,45vh);overflow:auto;-webkit-overflow-scrolling:touch;min-width:5.6rem;box-shadow:0 18px 36px rgba(0,0,0,.3)}
.cb li{display:flex;align-items:center;min-height:2.6rem;padding:0 1rem;font-size:.95rem;color:var(--fg);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.cb li:hover,.cb li:active{background:var(--acc);color:var(--onacc)}

/* ============ Tulu output (palm-leaf) ============ */
#out{
  position:relative;display:flex;flex-direction:column;margin:0;min-height:10.5rem;padding:1.4rem 1.5rem;
  font-family:var(--tf),"Mandara",sans-serif;font-weight:normal;font-size:2.25rem;line-height:1.35;
  font-feature-settings:"liga" 1,"kern" 1;text-transform:none;letter-spacing:0;
  white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;-webkit-overflow-scrolling:touch;resize:vertical;
  color:#0b0d0c;background:#fff;border:1px solid #dde2db;border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.12)
}
#out.bold{font-weight:700}
#ot{flex:none;width:100%;min-width:0}
#out[data-v="top"] #ot{margin-bottom:auto}
#out[data-v="middle"] #ot{margin:auto 0}
#out[data-v="bottom"] #ot{margin-top:auto}
#kn{min-height:1rem;padding:.1rem .25rem;color:var(--muted);font-size:.84rem;white-space:pre-wrap;overflow-wrap:anywhere}
#kn:not(:empty)::before{content:"KANNADA PREVIEW";display:block;margin-bottom:.2rem;font:700 .62rem/1.2 system-ui,sans-serif;letter-spacing:.13em;color:var(--muted)}

/* ============ Input + buttons ============ */
#in{
  display:block;width:100%;min-height:5.25rem;padding:.9rem 1rem;resize:vertical;
  font-family:"Noto Sans Kannada","Noto Sans Tulu Tigalari","Noto Serif Tulu Tigalari",system-ui,sans-serif;font-size:1rem;line-height:1.55;   /* 16px: stops iOS zoom-on-focus */
  color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.055);transition:border-color .18s,box-shadow .18s
}
#in::placeholder{color:var(--muted);opacity:.82}
#in:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.bar{display:flex;gap:.6rem;align-items:stretch}
.bar button{
  flex:1 1 0;min-width:0;min-height:2.9rem;padding:.72rem .9rem;
  font-size:.88rem;font-weight:600;line-height:1.2;color:var(--fg);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.08);transition:transform .16s,border-color .16s,background .16s;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}
.bar button.on,.bar button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.bar button.pri{flex:1.4 1 0;box-shadow:0 4px 12px rgba(217,173,104,.17)}
.bar button:active{transform:translateY(1px)}

/* ============ Keyboard ============ */
#kb{
  padding:.75rem .65rem .7rem;border:1px solid var(--line);border-radius:19px;
  background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 52%),var(--kbd);
  box-shadow:0 12px 28px rgba(0,0,0,.12);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}
.krow{display:flex;gap:.38rem;justify-content:center;margin-bottom:.42rem}
.krow:last-child{margin-bottom:0}
.k{
  position:relative;flex:1 1 0;min-width:0;max-width:3.6rem;height:var(--kh);padding:0;border:0;border-radius:11px;
  background:var(--key);color:var(--keytxt);cursor:pointer;
  box-shadow:0 3px 0 var(--keysh),inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .12s,background .12s,color .12s,box-shadow .12s
}
.k:active{background:var(--acc);color:var(--onacc);transform:translateY(2px);box-shadow:0 1px 0 var(--keysh)}
.k .g{display:block;font-family:var(--tf),"Mandara",sans-serif;font-size:1.7rem;line-height:var(--kh);text-transform:none}
.k .l{position:absolute;right:6px;bottom:4px;font-family:"Noto Sans Kannada",system-ui,sans-serif;font-size:.58rem;line-height:1;color:var(--keytxt);opacity:.62;pointer-events:none}
.k.fn{flex:1.4 1 0;max-width:5.2rem;border-radius:10px;background:var(--keyfn);font:600 .78rem system-ui,sans-serif;letter-spacing:.04em}
.k.fn.on{background:var(--acc);color:var(--onacc)}
.k.sp{flex:6 1 0;max-width:none;font:500 .68rem system-ui,sans-serif;letter-spacing:.16em}
.k.ent{flex:1.2 1 0;max-width:4.4rem;font-size:1.2rem}
.hide{display:none}
@media (hover:hover){
  .bar button:hover{transform:translateY(-1px);border-color:var(--acc)}
  .k:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--key) 78%,var(--acc))}
  .k.fn:hover{background:color-mix(in srgb,var(--keyfn) 78%,var(--acc))}
  .k:active{transform:translateY(2px)}
}


/* ---- optional Kannada preview + text box ---- */
.opt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4rem .5rem;min-width:0}
.ffw{display:flex;align-items:center;gap:.4rem;margin-left:auto;min-width:0;color:var(--muted);font:700 .68rem/1 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.ffw select{min-width:0;max-width:46vw;min-height:2.4rem;padding:.3rem .6rem;font:600 1rem system-ui,sans-serif;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px}
.tg{align-self:flex-start;max-width:100%;min-height:2.4rem;padding:.35rem .85rem;font:600 .78rem/1.2 system-ui,sans-serif;color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:999px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:border-color .15s,color .15s}
.tg:active,.tg[aria-expanded="true"]{color:var(--fg);border-style:solid;border-color:var(--acc)}
@media (hover:hover){.tg:hover{color:var(--fg);border-color:var(--acc)}}
#pnl:not(.hide){display:flex;flex-direction:column;gap:.6rem}
.tg.hide{display:none}

/* ---- layout panel: position + spacing ---- */
#lay:not(.hide){display:grid;grid-template-columns:1fr 1fr;gap:.5rem .7rem;padding:.6rem .7rem;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.lg{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.lg>span,.lg>label{display:flex;justify-content:space-between;gap:.3rem;color:var(--muted);font:700 .62rem/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.lg b{color:var(--fg);letter-spacing:0;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1 1 0;min-width:0;min-height:2.3rem;padding:0 .15rem;font:600 .74rem system-ui,sans-serif;color:var(--fg);background:transparent;border:0;border-right:1px solid var(--line);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.lg input[type=range]{width:100%;min-height:2.3rem;margin:0;accent-color:var(--acc)}
#layRst{grid-column:1 / -1;min-height:2.1rem;font:600 .74rem system-ui,sans-serif;color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:10px;cursor:pointer}
@media (max-width:420px){.ffw span{display:none}}

/* ============ Phones (portrait) ============ */
@media (max-width:600px){
  :root{--kh:clamp(2.2rem,min(11.6vw,7.4dvh),3.15rem)}
  body{
    gap:.6rem;
    padding:calc(.7rem + env(safe-area-inset-top,0px)) calc(.7rem + env(safe-area-inset-right,0px)) calc(.8rem + env(safe-area-inset-bottom,0px)) calc(.7rem + env(safe-area-inset-left,0px))
  }
  header{gap:.5rem;padding-bottom:.65rem}
  h1{font-size:clamp(1.1rem,5.4vw,1.3rem)}
  h1::before{font-size:.56rem;letter-spacing:.14em;margin-bottom:.25rem}
  .sz{gap:.4rem;font-size:.66rem}
  .cb input{width:3.2rem;min-height:2.6rem}
  .bd{min-height:2.6rem;min-width:2.6rem}
  #out{flex:1 1 auto;min-height:8.5rem;padding:1rem 1.1rem;border-radius:14px}
  .tg{min-height:2.6rem;font-size:.76rem}
  #pnl:not(.hide){gap:.5rem}
  #in{min-height:4.4rem;padding:.75rem .9rem;border-radius:12px}
  .bar{gap:.45rem}
  .bar button{min-height:2.75rem;padding:.55rem .4rem;font-size:.82rem;border-radius:11px}
  .bar:has(#sys){display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
  .bar:has(#sys) button{padding:.5rem .15rem;font-size:.7rem;line-height:1.15}
  /* keyboard docks to the bottom edge like a native one */
  #kb{
    position:sticky;bottom:0;z-index:10;
    margin:auto calc(-.7rem - env(safe-area-inset-right,0px)) calc(-.8rem - env(safe-area-inset-bottom,0px)) calc(-.7rem - env(safe-area-inset-left,0px));
    padding:.55rem calc(.4rem + env(safe-area-inset-right,0px)) calc(.55rem + env(safe-area-inset-bottom,0px)) calc(.4rem + env(safe-area-inset-left,0px));
    border-width:1px 0 0;border-radius:18px 18px 0 0;
    box-shadow:0 -10px 24px rgba(0,0,0,.22)
  }
  .krow{gap:.26rem;margin-bottom:.32rem}
  .k{border-radius:9px;box-shadow:0 2px 0 var(--keysh),inset 0 1px 0 rgba(255,255,255,.07)}
  .k .g{font-size:clamp(1.35rem,6.6vw,1.6rem)}
  .k.fn{font-size:.76rem}
  .k.sp{font-size:.62rem}
  .cb ul{max-height:min(13rem,40vh)}
}
@media (max-width:380px){
  body{padding-left:calc(.55rem + env(safe-area-inset-left,0px));padding-right:calc(.55rem + env(safe-area-inset-right,0px))}
  #kb{margin-left:calc(-.55rem - env(safe-area-inset-left,0px));margin-right:calc(-.55rem - env(safe-area-inset-right,0px))}
  #out{min-height:6.75rem;padding:.9rem 1rem}
  .bar:has(#sys) button{font-size:.64rem}
  .krow{gap:.2rem}
  .k.fn{font-size:.72rem}
}
@media (max-width:340px){
  .ffw span{display:none}
  .k .l{display:none}
  h1{font-size:1.02rem}
  .sz label{display:none}
}

/* ============ Phones (portrait): fixed app layout, nothing hidden behind the keys ============ */
@media (max-width:600px){
  html:not(.land) body{height:var(--vvh,100dvh);min-height:0;overflow:hidden}
  html:not(.land) #out{flex:1 1 0;min-height:4.5rem;max-height:none}
  html:not(.land) #kn{flex:none;max-height:2.6rem;overflow:hidden}
  html:not(.land) #kb{position:relative;flex:none;margin-top:0}
  html:not(.land) #lay,html:not(.land) .bar,html:not(.land) .opt,html:not(.land) .tg,html:not(.land) #pnl,html:not(.land) header{flex:none}
  html:not(.land).own #out{flex:1 1 0;max-height:none}
  html:not(.land) #pnl:not(.hide) #in{min-height:3.4rem;max-height:6.5rem}
}
/* short portrait phones: tighten so buttons + all key rows fit with no scrolling */
@media (max-width:600px) and (max-height:700px){
  html:not(.land) body{gap:.4rem}
  html:not(.land) header{padding-bottom:.4rem}
  html:not(.land) h1::before{display:none}
  html:not(.land) #kn:not(:empty)::before{display:none}
  html:not(.land) .tg{min-height:2rem;padding:.2rem .75rem}
  html:not(.land) .ffw select{min-height:2rem;padding:.15rem .5rem}
  html:not(.land) .bar button{min-height:2.4rem;padding:.35rem .25rem}
  html:not(.land) #kb{padding-top:.4rem}
  html:not(.land) .krow{margin-bottom:.26rem}
}
/* ============ Phones (landscape): output left, keys right ============ */
/* html.land comes from JS using the real screen orientation, so the phone keyboard
   shrinking the window can never flip the layout into landscape mode */
html.land{--kh:clamp(2.1rem,10.5vh,2.6rem)}
html.land body{
  width:100%;max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);
  grid-auto-rows:min-content;align-content:start;column-gap:.8rem;row-gap:.5rem;
  padding:calc(.5rem + env(safe-area-inset-top,0px)) calc(.7rem + env(safe-area-inset-right,0px)) .6rem calc(.7rem + env(safe-area-inset-left,0px))
}
html.land body>*{grid-column:1}
html.land header{padding-bottom:.4rem}
html.land h1::before{display:none}
html.land #out{flex:none;min-height:5.5rem;padding:.8rem 1rem}
html.land #in{min-height:3.4rem}
html.land #kb{
  grid-column:2;grid-row:1 / span 8;align-self:start;
  position:sticky;top:calc(.5rem + env(safe-area-inset-top,0px));bottom:auto;margin:0;
  border-width:1px;border-radius:14px;padding:.45rem .4rem;box-shadow:0 8px 20px rgba(0,0,0,.18)
}
html.land .krow{margin-bottom:.25rem}
html.land.own body{grid-template-columns:minmax(0,1fr)}
html.land h1{font-size:1.15rem}
html.land .bar{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
html.land .bar button{min-height:2.3rem;padding:.3rem .4rem;font-size:.8rem;overflow-wrap:normal;word-break:normal}
html.land .tg{min-height:2rem}
html.land .bar #shr{grid-column:1 / -1}

/* ============ Own phone keyboard: keep output + text box visible above the OS keyboard ============ */
html{--vvh:100dvh}
html.own body{min-height:var(--vvh)}
html.own #out{flex:none;min-height:5rem;max-height:calc(var(--vvh) * .34);resize:none}
html.own #in{resize:none}
html.typing #in{min-height:3.6rem}
html.typing.short header,html.typing.short h1::before{display:none}
html.typing.short body{gap:.4rem}

@media (min-width:700px){body{padding-top:calc(1.6rem + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ Refined visual system ============ */
:root{
  --bg:#111d17;--fg:#f0f1e9;--muted:#a6b1a5;--panel:#1b2a22;--line:#35493c;
  --acc:#d7ad68;--onacc:#20180c;--leaf:#fff8e9;--leafink:#202b24;--leafedge:#e6dac0;
  --kbd:#19271f;--key:#34483c;--keyfn:#455b4a;--keysh:#0b1510;--keytxt:#f5f2e8;--hole:#111d17;
  color-scheme:dark
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f2f1e9;--fg:#243129;--muted:#69776c;--panel:#fffdf7;--line:#d8d9cb;
    --acc:#a8752e;--onacc:#fffaf0;--kbd:#e4e7dd;--key:#fffdf7;--keyfn:#d7dfd2;
    --keysh:#c5cebf;--keytxt:#28362d;--hole:#f2f1e9;color-scheme:light
  }
}
html{
  background:
    radial-gradient(ellipse at 50% -18%,rgba(215,173,104,.13),transparent 54%),
    linear-gradient(160deg,rgba(35,64,48,.18),transparent 52%),var(--bg);
  background-color:var(--bg)
}
body{width:min(100%,48rem);gap:1rem}
header{
  position:relative;gap:.8rem;padding:.2rem .15rem .9rem;
  border-bottom-color:color-mix(in srgb,var(--line) 80%,var(--acc))
}
header::before{
  content:"ತು";display:grid;place-items:center;flex:none;width:2.9rem;height:2.9rem;
  color:var(--onacc);background:linear-gradient(145deg,#e6c986,#bd8c43);
  border:1px solid rgba(255,255,255,.22);border-radius:15px;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
  font:700 1.15rem/1 "Noto Serif Kannada","Noto Sans Kannada",serif
}
h1{flex:1;font-size:1.65rem;letter-spacing:-.035em}
h1::before{
  content:"TULU WRITING TOOL";margin-bottom:.24rem;color:var(--acc);
  font-size:.62rem;letter-spacing:.17em
}
h1::after{
  content:"Mandara Keyboard";display:block;margin-top:.18rem;color:var(--muted);
  font:500 .78rem/1.25 system-ui,sans-serif;letter-spacing:.025em
}
.sz{gap:.45rem}
.cb input,.cb button,.bd{min-height:2.75rem}
.bd{min-width:2.75rem}
#out{
  min-height:13rem;padding:1.55rem;
  color:var(--leafink);
  background:
    radial-gradient(ellipse at 8% 10%,rgba(201,150,69,.075),transparent 32%),
    repeating-linear-gradient(0deg,transparent 0 34px,rgba(87,103,70,.035) 35px 36px),
    linear-gradient(135deg,#fffaf0,#f7efd9);
  border-color:var(--leafedge);border-radius:19px;
  box-shadow:0 14px 34px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.8)
}
#out::before{
  content:"";position:absolute;inset:9px;z-index:0;pointer-events:none;
  border:1px solid rgba(164,128,67,.13);border-radius:11px
}
#ot{position:relative;z-index:1}
#kn:not(:empty){
  padding:.65rem .85rem;color:var(--fg);background:var(--panel);
  border:1px solid var(--line);border-radius:13px
}
#kn:not(:empty)::before{color:var(--acc)}
.opt{
  padding:.55rem .65rem;background:var(--panel);border:1px solid var(--line);
  border-radius:15px
}
.tg{
  min-height:2.75rem;padding:.45rem .9rem;color:var(--fg);
  border-style:solid;background:color-mix(in srgb,var(--panel) 74%,var(--bg))
}
.ffw{letter-spacing:.12em}
.ffw select{min-height:2.75rem;border-radius:11px}
#lay:not(.hide){
  padding:.8rem;background:var(--panel);border-color:var(--line);
  border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,.08)
}
.seg button{min-height:2.75rem}
#layRst{min-height:2.75rem}
#in{min-height:5.5rem;background:color-mix(in srgb,var(--panel) 93%,var(--bg))}
.bar{gap:.55rem}
.bar button{
  min-height:2.9rem;border-radius:13px;
  box-shadow:0 3px 0 color-mix(in srgb,var(--line) 75%,transparent)

function fontFaceCss(){

/* tight box around the written text only (sticker: no empty area) */
function geom(px){
  var r=document.createRange();r.selectNodeContents(ot);
  var base=ot.getBoundingClientRect(),L=1e9,T=1e9,R=-1e9,B=-1e9;
  Array.prototype.forEach.call(r.getClientRects(),function(c){
    if(c.width<=0||c.height<=0)return;
    L=Math.min(L,c.left);R=Math.max(R,c.right);T=Math.min(T,c.top);B=Math.max(B,c.bottom)});
  if(L>R)return null;
  var m={l:L-base.left,t:T-base.top,w:R-L,h:B-T,cw:base.width,oh:base.height,base:base};
  m.pad=Math.ceil(px*.3);m.W=Math.ceil(m.w+m.pad*2);m.H=Math.ceil(m.h+m.pad*2);
  m.sc=Math.max(.25,Math.min(ISC,8000/Math.max(m.W,m.H),Math.sqrt(16000000/(m.W*m.H))));
  return m;
}

/* Exported PNG = transparent sticker (letters only) with a thin contrasting outline, so the writing is clearly visible on ANY background (white on white, black on dark ...) */
function outlinePng(src,W,H,sc,px,fn){
  var w=Math.round(W*sc),h=Math.round(H*sc),r=Math.max(2,Math.round(px*sc*.075)),cw=w+r*2,ch=h+r*2;
  var t=document.createElement("canvas");t.width=cw;t.height=ch;
  var tx=t.getContext("2d");tx.drawImage(src,r,r,w,h);
  var sil=document.createElement("canvas");sil.width=cw;sil.height=ch;
  var sx=sil.getContext("2d");sx.drawImage(t,0,0);
  sx.globalCompositeOperation="source-in";sx.fillStyle=white?"#000":"#fff";sx.fillRect(0,0,cw,ch);
  var o2=document.createElement("canvas");o2.width=cw;o2.height=ch;
  var ox=o2.getContext("2d"),N=20;
  for(var a=0;a<N;a++){var an=a/N*Math.PI*2;ox.drawImage(sil,Math.cos(an)*r,Math.sin(an)*r)}
  ox.drawImage(sil,0,0);
  ox.drawImage(t,0,0);
  o2.toBlob(function(b){fn(b)},"image/png");
}
function makeImageSvg(){
  var txt=tulu().replace(/ /g,"").replace(/\s+$/,"");
  if(!txt)return Promise.reject(new Error("empty"));
  var px=parseFloat(getComputedStyle(ot).fontSize)||32;
  return document.fonts.load((bold?"700":"400")+" "+px+"px \""+fam()+"\"",txt).then(function(){
    show();
    var m=geom(px);if(!m)throw new Error("empty");
    var css=fontFaceCss();if(!css)throw new Error("nofont");
    var st=getComputedStyle(ot),cl=ot.cloneNode(true);cl.removeAttribute("id");
    cl.setAttribute("style","margin:0;padding:0;width:"+m.cw+"px;font-family:'"+fam()+"';font-size:"+px+"px;font-weight:"+(bold?700:400)+";line-height:"+st.lineHeight+";"
      +"text-align:"+st.textAlign+";letter-spacing:"+st.letterSpacing+";word-spacing:"+st.wordSpacing+";font-feature-settings:'liga' 1,'kern' 1;"
      +"white-space:"+st.whiteSpace+";overflow-wrap:"+st.overflowWrap+";color:"+TC()+";background:transparent;"+"");
    var xml=new XMLSerializer().serializeToString(cl);
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+m.W+'" height="'+m.H+'"><style>'+css.replace(/</g,"&lt;")+'</style>'
      +'<foreignObject x="'+(m.pad-m.l)+'" y="'+(m.pad-m.t)+'" width="'+m.cw+'" height="'+Math.ceil(m.oh+px)+'">'+xml+'</foreignObject></svg>';
    return new Promise(function(res,rej){
      var im=new Image();
      im.onload=function(){
        try{outlinePng(im,m.W,m.H,m.sc,px,function(b){b?res(b):rej(new Error("blob"))})}catch(e){rej(e)}
      };
      im.onerror=function(){rej(new Error("svg"))};
      im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    });
  });
}
function makeImage(){return makeImageSvg().catch(function(e){if(e&&e.message==="empty")throw e;return makeImageCanvas()})}
function makeImageCanvas(){
  var txt=tulu().replace(/ /g,"").replace(/\s+$/,"");
  if(!txt)return Promise.reject(new Error("empty"));
  var cs=getComputedStyle(ot),px=parseFloat(cs.fontSize)||32;
  return document.fonts.load((bold?"700":"400")+" "+px+"px \""+fam()+"\"",txt).then(function(){
    show();
    var m=geom(px);if(!m)throw new Error("empty");
    var base=m.base;
    var c=document.createElement("canvas");c.width=Math.round(m.W*m.sc);c.height=Math.round(m.H*m.sc);
    var x=c.getContext("2d");x.scale(m.sc,m.sc);x.translate(m.pad-m.l,m.pad-m.t);
    var hasLS="letterSpacing" in x,lsPx=LAY.ls/100*px;
    x.font=(bold?"bold ":"")+px+"px \""+fam()+"\"";
    x.fillStyle=TC();x.textBaseline="alphabetic";try{x.textRendering="optimizeLegibility";x.fontKerning="normal";x.fontVariantLigatures="common-ligatures"}catch(_){}
    if(hasLS)x.letterSpacing=(lsPx||0)+"px";
    var asc=x.measureText("M").fontBoundingBoxAscent;
    var node=ot.firstChild;if(!node||node.nodeType!==3)throw new Error("empty");
    var str=node.data,r=document.createRange(),idx=0,words=[],cur=null,prev=null,lh=parseFloat(cs.lineHeight)||px*1.35;
    function push(){if(cur&&cur.t)words.push(cur);cur=null}
    Array.from(str).forEach(function(ch){
      var len=ch.length;r.setStart(node,idx);r.setEnd(node,idx+len);idx+=len;
      var rc=r.getClientRects()[0];
      if(/\s/.test(ch)){push();prev=null;return}
      if(!rc){if(cur){cur.t+=ch;cur.xs.push(cur.xs[cur.xs.length-1])}return}
      if(prev&&Math.abs(rc.top-prev.top)>lh*.4)push();
      if(!cur)cur={t:"",xs:[],x:rc.left-base.left,y:rc.top-base.top};
      cur.t+=ch;cur.xs.push(rc.left-base.left);prev=rc;
    });
    push();
    words.forEach(function(w){
      var y=w.y+(asc||px*.9);
      if(!lsPx||hasLS){x.fillText(w.t,w.x,y)}
      else{Array.from(w.t).forEach(function(ch,n){x.fillText(ch,w.xs[n],y)})}
    });
    return new Promise(function(res,rej){outlinePng(c,m.W,m.H,m.sc,px,function(b){b?res(b):rej(new Error("blob"))})});
  });
}
